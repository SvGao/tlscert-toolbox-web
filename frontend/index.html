<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Self-hosted X.509 bench: extract keys from PFX, rebuild chains, convert PEM and DER, inspect certificates, generate CSRs. Nothing is stored." />
    <title>Certificate Toolbox</title>
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/splinemono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Set the theme before first paint so the page never flashes the wrong ground.
      try {
        var saved = localStorage.getItem('ct-theme');
        var t = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
