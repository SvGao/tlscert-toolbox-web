services:
  cert-toolbox:
    build: .
    container_name: cert-toolbox
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      - PORT=8080
      - TMP_ROOT=/tmp/cert-toolbox
      # Download link lifetime in milliseconds (default 1 hour).
      - LINK_TTL_MS=3600000
    # Temp files live in a tmpfs so nothing ever touches a persistent disk.
    tmpfs:
      - /tmp/cert-toolbox
